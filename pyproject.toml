[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "boss-bench"
version = "1.0.0"
description = "Load the BoSS stellarator database and compute the benchmark metrics."
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "<AUTHORS>"}]
requires-python = ">=3.9"
dependencies = ["numpy", "scipy", "h5py", "matplotlib"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Documentation = "<DOCUMENTATION_URL>"
Paper = "<PAPER_URL>"
Data = "https://app.globus.org/file-manager?origin_id=04779ab9-4a4e-4381-be6a-860f0433a4af&origin_path=%2F"

[tool.setuptools]
packages = ["boss_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
