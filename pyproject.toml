[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "boss-bench"
version = "1.0.0"
description = "Load the BoSS stellarator database and compute the benchmark metrics."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "The BoSS Development Team"}]
requires-python = ">=3.9"
dependencies = ["numpy", "scipy", "h5py", "matplotlib"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.optional-dependencies]
models = ["torch", "safetensors"]
test = ["pytest"]

[project.urls]
Homepage = "https://boss.flatironinstitute.org/"
Documentation = "https://boss.flatironinstitute.org/"
Repository = "https://github.com/mishapadidar/boss_bench"
Issues = "https://github.com/mishapadidar/boss_bench/issues"
# Paper = "<PAPER_URL>"  # once the paper is out
Data = "https://app.globus.org/file-manager?origin_id=04779ab9-4a4e-4381-be6a-860f0433a4af&origin_path=%2F"

[tool.setuptools]
packages = ["boss_bench", "boss_bench.models"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
